<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>loading...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0D1117;
      --surface:    #161B22;
      --surface2:   #1C2333;
      --border:     #263044;
      --green:      #00D26A;
      --green-dim:  #00914a;
      --green-glow: #00D26A22;
      --text:       #E8EDF5;
      --muted:      #8B9AB0;
      --mono:       'JetBrains Mono', monospace;
      --sans:       'Inter', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.65;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* pixel grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 32px 32px;
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }

    /* layout */
    .layout {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
    }

    /* sidebar */
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 2.5rem 1.5rem;
      gap: 1.75rem;
      background: var(--bg);
    }

    .sidebar-avatar {
      display: flex;
      justify-content: flex-start;
    }

    .sidebar-avatar img {
      display: block;
      object-fit: cover;
    }

    .sidebar-brand { display: flex; flex-direction: column; gap: 0.2rem; }

    .brand-name {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    /* blinking cursor after name */
    .brand-name::after {
      content: '_';
      color: var(--green);
      animation: blink 1.1s step-end infinite;
    }

    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

    .brand-tag {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
    }

    .sidebar-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      color: var(--muted);
      font-family: var(--mono);
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2.5s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

    nav { display: flex; flex-direction: column; gap: 0.2rem; }

    nav a {
      font-family: var(--mono);
      font-size: 0.76rem;
      color: var(--muted);
      text-decoration: none;
      padding: 0.42rem 0.7rem;
      border-radius: 4px;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    nav a .ni { font-size: 0.75rem; opacity: 0.5; }
    nav a:hover, nav a.active {
      color: var(--green);
      border-color: var(--border);
      background: var(--green-glow);
    }
    nav a.active .ni { opacity: 1; }

    .sidebar-footer {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .sidebar-footer a {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 0.15s;
    }

    .sidebar-footer a:hover { color: var(--green); }

    /* main */
    main { padding: 0; }

    section {
      padding: 5rem 4rem;
      border-bottom: 1px solid var(--border);
      max-width: 900px;
    }

    /* section label */
    .section-label {
      font-family: var(--mono);
      font-size: 0.66rem;
      color: var(--green);
      letter-spacing: 0.08em;
      margin-bottom: 1.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-label::after {
      content: '';
      width: 48px;
      height: 1px;
      background: var(--green-dim);
    }

    /* hero */
    #hero { padding-top: 6rem; padding-bottom: 6rem; }

    .hero-console {
      font-family: var(--mono);
      font-size: 0.73rem;
      color: var(--muted);
      margin-bottom: 2rem;
      line-height: 2;
    }

    .hero-console .c-green { color: var(--green); }
    .hero-console .c-dim   { color: #344861; }

    .hero-title {
      font-family: var(--mono);
      font-weight: 700;
      font-size: clamp(1.9rem, 3.8vw, 3rem);
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 1.25rem;
      color: var(--text);
    }

    .hero-title .accent { color: var(--green); }

    .hero-sub {
      font-size: 0.95rem;
      color: var(--muted);
      max-width: 500px;
      line-height: 1.75;
      margin-bottom: 2.25rem;
    }

    .hero-cta { display: flex; gap: 0.85rem; flex-wrap: wrap; }

    .btn {
      font-family: var(--mono);
      font-size: 0.76rem;
      padding: 0.6rem 1.3rem;
      border-radius: 4px;
      text-decoration: none;
      display: inline-block;
      transition: all 0.15s;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--green);
      color: #040e08;
      border: 1px solid var(--green);
      font-weight: 700;
    }

    .btn-primary:hover {
      box-shadow: 0 0 18px var(--green-glow), 0 0 5px var(--green);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover { border-color: var(--green); color: var(--green); }

    /* about */
    #about .about-text p {
      color: var(--muted);
      max-width: 580px;
      margin-bottom: 1rem;
      font-size: 0.93rem;
    }

    #about .about-text p b { color: var(--text); font-weight: 600; }
    #about .about-text p:last-child { margin-bottom: 0; }

    .exp-grid {
      margin-top: 2.25rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.85rem;
    }

    .exp-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem 1.1rem 1rem;
    }

    .exp-num {
      font-family: var(--mono);
      font-size: 2rem;
      font-weight: 700;
      color: var(--green);
      line-height: 1;
      margin-bottom: 0.3rem;
    }

    .exp-label {
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.45;
      white-space: pre-line;
    }

    /* skills */
    .skill-group { margin-bottom: 2rem; }

    .skill-group-title {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 0.85rem;
      padding-bottom: 0.45rem;
      border-bottom: 1px solid var(--border);
    }

    .plugin-config {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .plugin-header {
      background: var(--surface2);
      padding: 0.38rem 1rem;
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .plugin-header .pf { color: var(--green); }

    .plugin-body {
      padding: 0.85rem 1rem;
      font-family: var(--mono);
      font-size: 0.73rem;
      line-height: 2;
    }

    .cfg-key  { color: #7eb6ff; }
    .cfg-val  { color: #ce93d8; }
    .cfg-str  { color: #a5d6a7; }
    .cfg-com  { color: #344861; }

    /* projects */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 1rem;
    }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .project-card:hover {
      border-color: var(--green);
      box-shadow: 0 0 20px #00D26A0D;
    }

    .project-card:hover .project-name { color: var(--green); }

    .card-top-bar {
      background: var(--surface2);
      padding: 0.38rem 1rem;
      font-family: var(--mono);
      font-size: 0.66rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .ctb-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }

    .card-image {
      overflow: hidden;
      flex-shrink: 0;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border);
    }

    .card-image img {
      display: block;
      width: 100%;
      object-position: center;
    }

    .card-image .img-placeholder {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--border);
      text-align: center;
      padding: 2rem;
    }

    .card-body {
      padding: 1.1rem 1.1rem 1.25rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .project-type {
      font-family: var(--mono);
      font-size: 0.63rem;
      color: var(--green);
      margin-bottom: 0.3rem;
    }

    .project-name {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 0.92rem;
      margin-bottom: 0.6rem;
      transition: color 0.15s;
      line-height: 1.3;
    }

    .project-desc {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 1rem;
      flex: 1;
    }

    .project-footer {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .tag {
      font-family: var(--mono);
      font-size: 0.6rem;
      padding: 0.18rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--muted);
    }

    .project-link {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--green);
      text-decoration: none;
      border: 1px solid var(--green-dim);
      border-radius: 4px;
      padding: 0.35rem 0.75rem;
      text-align: center;
      transition: background 0.15s;
      display: block;
    }

    .project-link:hover { background: var(--green-glow); }

    /* contact */
    #contact .contact-inner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2rem;
      max-width: 480px;
    }

    .contact-console {
      font-family: var(--mono);
      font-size: 0.73rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
      line-height: 2;
    }

    .c-prompt { color: var(--green); }

    #contact h2 {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 1.15rem;
      margin-bottom: 0.55rem;
    }

    #contact p {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
      line-height: 1.65;
    }

    .contact-link {
      font-family: var(--mono);
      font-size: 0.76rem;
      color: var(--muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.6rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      transition: all 0.15s;
    }

    .contact-link:hover {
      color: var(--green);
      border-color: var(--green);
      background: var(--green-glow);
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 9px; }

    /* responsive */
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }

      .sidebar {
        position: static;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--border);
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        padding: 1rem 1.25rem;
        gap: 0.75rem;
      }

      .sidebar-avatar { display: none; }
      .sidebar-footer  { display: none; }

      nav { flex-direction: row; flex-wrap: wrap; gap: 0.15rem; }

      section { padding: 3rem 1.5rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .status-dot { animation: none; }
      .brand-name::after { animation: none; }
    }
  </style>
</head>
<body>

<!-- config.js must load before this script -->
<script src="config.js"></script>

<div class="layout">

  <!-- SIDEBAR (built by JS) -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- MAIN -->
  <main id="main"></main>

</div>

<script>
/* ============================================================
   Render engine — reads CONFIG, writes DOM. Do not edit below.
   ============================================================ */

const C = CONFIG;

/* helpers */
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function svgIcon(name) {
  const icons = {
    discord: `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.032.054a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>`
  };
  return icons[name] || '';
}

/* apply accent color from config */
document.documentElement.style.setProperty('--green', C.accentColor || '#00D26A');
document.title = C.pageTitle || C.name;

/* ── SIDEBAR ── */
const sidebar = document.getElementById('sidebar');

// avatar
if (C.avatar && C.avatar.visible !== false) {
  const av = C.avatar;
  const wrapper = el('div', 'sidebar-avatar');
  const img = document.createElement('img');
  img.src = av.src;
  img.alt = C.name + ' avatar';
  img.width  = av.width  || 80;
  img.height = av.height || 80;
  img.style.width  = (av.width  || 80) + 'px';
  img.style.height = (av.height || 80) + 'px';
  img.style.objectFit = 'cover';

  const shape = av.shape || 'square';
  if (shape === 'circle')  img.style.borderRadius = '50%';
  else if (shape === 'rounded') img.style.borderRadius = '10px';
  else img.style.borderRadius = '4px';

  if (av.border) {
    img.style.border = '2px solid var(--green)';
    img.style.boxShadow = '0 0 10px var(--green-glow)';
  }

  wrapper.appendChild(img);
  sidebar.appendChild(wrapper);
}

// brand
const brand = el('div', 'sidebar-brand');
brand.innerHTML = `
  <span class="brand-name">${C.name}</span>
  <span class="brand-tag">// ${C.title}</span>
`;
sidebar.appendChild(brand);

// status dot
if (C.statusVisible !== false) {
  const st = el('div', 'sidebar-status');
  st.innerHTML = `<span class="status-dot"></span>${C.status}`;
  sidebar.appendChild(st);
}

// nav
const nav = el('nav');
const navItems = [
  { href: '#hero',     label: 'home'     },
  { href: '#about',    label: 'about'    },
  { href: '#skills',   label: 'skills'   },
  { href: '#projects', label: 'projects' },
  { href: '#contact',  label: 'contact'  },
];
navItems.forEach(n => {
  const a = document.createElement('a');
  a.href = n.href;
  a.innerHTML = `<span class="ni">⬡</span>${n.label}`;
  nav.appendChild(a);
});
sidebar.appendChild(nav);

// footer (discord only)
const footer = el('div', 'sidebar-footer');
if (C.contact && C.contact.discord) {
  const a = document.createElement('a');
  a.href = C.contact.discordUrl || '#';
  a.target = '_blank';
  a.innerHTML = `${svgIcon('discord')} ${C.contact.discord}`;
  footer.appendChild(a);
}
sidebar.appendChild(footer);

/* ── MAIN ── */
const main = document.getElementById('main');

/* -- HERO -- */
const hero = el('section', '');
hero.id = 'hero';

const titleLines = (C.heroLines || []).map((line, i) =>
  i === 0 ? `<span class="accent">${line}</span>` : line
).join('<br>');

hero.innerHTML = `
  <div class="hero-console">
    <span class="c-dim">[00:00:01]</span> <span class="c-green">INFO</span>  Server starting...<br>
    <span class="c-dim">[00:00:02]</span> <span class="c-green">INFO</span>  Loading plugins... <span class="c-green">OK</span><br>
    <span class="c-dim">[00:00:03]</span> <span class="c-green">INFO</span>  Developer online. <span class="c-green">✓</span>
  </div>
  <h1 class="hero-title">${titleLines}</h1>
  <p class="hero-sub">${C.heroBio || ''}</p>
  <div class="hero-cta">
    <a class="btn btn-primary" href="#projects">View my work</a>
    <a class="btn btn-secondary" href="#contact">Get in touch</a>
  </div>
`;
main.appendChild(hero);

/* -- ABOUT -- */
const about = el('section', '');
about.id = 'about';
const aboutParas = (C.aboutParagraphs || []).map(p => `<p>${p}</p>`).join('');
const statsHTML = (C.stats || []).map(s => `
  <div class="exp-card">
    <div class="exp-num">${s.num}</div>
    <div class="exp-label">${s.label}</div>
  </div>
`).join('');
about.innerHTML = `
  <div class="section-label">about.yml</div>
  <div class="about-text">${aboutParas}</div>
  <div class="exp-grid">${statsHTML}</div>
`;
main.appendChild(about);

/* -- SKILLS -- */
const skills = el('section', '');
skills.id = 'skills';
skills.innerHTML = `<div class="section-label">config.yml</div>`;

(C.skillGroups || []).forEach(group => {
  const linesHTML = group.lines.map(line => {
    const valClass = line.type === 'str'  ? 'cfg-str' : 'cfg-val';
    const valText  = line.type === 'bool'
      ? (line.val === true ? 'true' : line.val === false ? 'false' : line.val)
      : `"${line.val}"`;
    return `<span class="cfg-key">${line.key}</span>: <span class="${valClass}">${valText}</span><br>`;
  }).join('');

  const block = el('div', 'skill-group');
  block.innerHTML = `
    <div class="skill-group-title"># ${group.label}</div>
    <div class="plugin-config">
      <div class="plugin-header">
        <span class="pf">${group.file}</span>
        <span>${group.sub}</span>
      </div>
      <div class="plugin-body">${linesHTML}</div>
    </div>
  `;
  skills.appendChild(block);
});
main.appendChild(skills);

/* -- PROJECTS -- */
const projects = el('section', '');
projects.id = 'projects';
projects.innerHTML = `<div class="section-label">plugins/</div>`;

const grid = el('div', 'projects-grid');

(C.projects || []).forEach(proj => {
  const card = el('div', 'project-card');

  // top bar
  const topBar = el('div', 'card-top-bar');
  topBar.innerHTML = `<span class="ctb-dot"></span>${proj.type.toLowerCase()} &bull; ${proj.version}`;
  card.appendChild(topBar);

  // image
  const imgWrap = el('div', 'card-image');
  if (proj.image && proj.image.src) {
    const img = document.createElement('img');
    img.src = proj.image.src;
    img.alt = proj.name;
    img.style.width      = proj.image.width  || '100%';
    img.style.height     = proj.image.height || '180px';
    img.style.objectFit  = proj.image.fit    || 'cover';
    imgWrap.appendChild(img);
    imgWrap.style.height = proj.image.height || '180px';
  } else {
    imgWrap.style.height = '100px';
    imgWrap.innerHTML = `<div class="img-placeholder">no image configured</div>`;
  }
  card.appendChild(imgWrap);

  // body
  const body = el('div', 'card-body');
  const tagsHTML = (proj.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
  const linkHTML = proj.link
    ? `<a class="project-link" href="${proj.link}" target="_blank">View on GitHub</a>`
    : '';
  body.innerHTML = `
    <div class="project-type">${proj.type} / ${proj.loader}</div>
    <div class="project-name">${proj.name}</div>
    <div class="project-desc">${proj.desc}</div>
    <div class="project-footer">
      <div class="project-tags">${tagsHTML}</div>
      ${linkHTML}
    </div>
  `;
  card.appendChild(body);
  grid.appendChild(card);
});
projects.appendChild(grid);
main.appendChild(projects);

/* -- CONTACT -- */
const contact = el('section', '');
contact.id = 'contact';
const dc = C.contact || {};
contact.innerHTML = `
  <div class="section-label">contact.sh</div>
  <div class="contact-inner">
    <div class="contact-console">
      <span class="c-prompt">$</span> whoami<br>
      <span style="color:var(--text)">${C.name}</span><br>
      <span class="c-prompt">$</span> status --check<br>
      <span style="color:var(--green)">${C.status}</span>
    </div>
    <h2>${dc.headline || "Let's build something."}</h2>
    <p>${dc.body || ''}</p>
    <a class="contact-link" href="${dc.discordUrl || '#'}" target="_blank">
      ${svgIcon('discord')}
      ${dc.discord || ''}
    </a>
  </div>
`;
main.appendChild(contact);

/* ── Active nav on scroll ── */
const allSections = document.querySelectorAll('section[id]');
const navLinks    = document.querySelectorAll('nav a');

const io = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      navLinks.forEach(l => {
        l.classList.toggle('active', l.getAttribute('href') === '#' + entry.target.id);
      });
    }
  });
}, { threshold: 0.35 });

allSections.forEach(s => io.observe(s));
</script>

</body>
