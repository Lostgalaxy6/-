<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>loading...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0D1117;
      --surface:    #161B22;
      --surface2:   #1C2333;
      --border:     #263044;
      --green:      #00D26A;
      --green-dim:  #00914a;
      --green-glow: #00D26A22;
      --text:       #E8EDF5;
      --muted:      #8B9AB0;
      --mono:       'JetBrains Mono', monospace;
      --sans:       'Inter', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.65;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* pixel grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 32px 32px;
      opacity: 0.13;
      pointer-events: none;
      z-index: 0;
    }

    /* ── scroll progress bar ── */
    #scroll-bar {
      position: fixed;
      top: 0; left: 0;
      height: 2px;
      width: 0%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      z-index: 1000;
      transition: width 0.05s linear;
    }

    /* ── music player ── */
    #music-btn {
      position: fixed;
      top: 14px;
      right: 18px;
      z-index: 999;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.38rem 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      user-select: none;
    }

    #music-btn:hover { border-color: var(--green); color: var(--green); background: var(--green-glow); }
    #music-btn.playing { border-color: var(--green); color: var(--green); }

    #music-btn svg { flex-shrink: 0; }

    /* ── layout ── */
    .layout {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
    }

    /* ── sidebar ── */
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 2.25rem 1.5rem;
      gap: 1.5rem;
      background: var(--bg);
      overflow: hidden;
    }

    .sidebar-avatar img {
      display: block;
      object-fit: cover;
    }

    .sidebar-brand { display: flex; flex-direction: column; gap: 0.2rem; }

    .brand-name {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .brand-cursor {
      display: inline-block;
      color: var(--green);
      animation: blink 1.1s step-end infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .brand-tag {
      font-family: var(--mono);
      font-size: 0.66rem;
      color: var(--muted);
    }

    .sidebar-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.7rem;
      color: var(--muted);
      font-family: var(--mono);
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2.5s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ticker */
    .ticker-wrap {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      padding: 0.3rem 0.6rem;
      font-family: var(--mono);
      font-size: 0.63rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .ticker-inner {
      display: inline-block;
      animation: ticker 12s linear infinite;
    }

    .ticker-inner .t-green { color: var(--green); }

    @keyframes ticker {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    nav { display: flex; flex-direction: column; gap: 0.18rem; }

    nav a {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-decoration: none;
      padding: 0.4rem 0.7rem;
      border-radius: 4px;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    nav a .ni { font-size: 0.7rem; opacity: 0.4; transition: opacity 0.15s; }
    nav a:hover, nav a.active { color: var(--green); border-color: var(--border); background: var(--green-glow); }
    nav a.active .ni, nav a:hover .ni { opacity: 1; }

    .sidebar-footer {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .sidebar-footer a {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 0.15s;
    }

    .sidebar-footer a:hover { color: var(--green); }

    /* ── main ── */
    main { padding: 0; }

    section {
      padding: 5rem 4rem;
      border-bottom: 1px solid var(--border);
      max-width: 900px;
    }

    .section-label {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--green);
      letter-spacing: 0.08em;
      margin-bottom: 1.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-label::after {
      content: '';
      width: 40px;
      height: 1px;
      background: var(--green-dim);
    }

    /* ── hero ── */
    #hero { padding-top: 6rem; padding-bottom: 6rem; }

    .hero-console {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 2rem;
      line-height: 2;
    }

    .hero-console .c-green { color: var(--green); }
    .hero-console .c-dim   { color: #2e4158; }

    .hero-title {
      font-family: var(--mono);
      font-weight: 700;
      font-size: clamp(1.8rem, 3.6vw, 2.9rem);
      line-height: 1.18;
      letter-spacing: -0.03em;
      margin-bottom: 1.25rem;
      min-height: 4.5em;
    }

    .hero-title .typing-line {
      display: block;
      overflow: hidden;
      white-space: nowrap;
      opacity: 0;
    }

    .hero-title .typing-line.visible { opacity: 1; }
    .hero-title .typing-line:first-child { color: var(--green); }

    .hero-sub {
      font-size: 0.93rem;
      color: var(--muted);
      max-width: 500px;
      line-height: 1.75;
      margin-bottom: 2.25rem;
      opacity: 0;
      transition: opacity 0.6s ease 0.3s;
    }

    .hero-sub.visible { opacity: 1; }

    .hero-cta { display: flex; gap: 0.85rem; flex-wrap: wrap; opacity: 0; transition: opacity 0.5s ease; }
    .hero-cta.visible { opacity: 1; }

    .btn {
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 0.58rem 1.25rem;
      border-radius: 4px;
      text-decoration: none;
      display: inline-block;
      transition: all 0.15s;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--green);
      color: #030e06;
      border: 1px solid var(--green);
      font-weight: 700;
    }

    .btn-primary:hover { box-shadow: 0 0 20px var(--green-glow), 0 0 6px var(--green); }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover { border-color: var(--green); color: var(--green); }

    /* ── about ── */
    #about .about-text p {
      color: var(--muted);
      max-width: 580px;
      margin-bottom: 1rem;
      font-size: 0.92rem;
    }

    #about .about-text p b { color: var(--text); font-weight: 600; }
    #about .about-text p:last-child { margin-bottom: 0; }

    .exp-grid {
      margin-top: 2.25rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 0.85rem;
    }

    .exp-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.2rem 1.1rem 1rem;
    }

    .exp-num {
      font-family: var(--mono);
      font-size: 2rem;
      font-weight: 700;
      color: var(--green);
      line-height: 1;
      margin-bottom: 0.3rem;
    }

    .exp-label {
      font-size: 0.73rem;
      color: var(--muted);
      line-height: 1.45;
      white-space: pre-line;
    }

    /* ── skills ── */
    .skill-group { margin-bottom: 1.75rem; }

    .skill-group-title {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
      margin-bottom: 0.8rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
    }

    .plugin-config {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .plugin-header {
      background: var(--surface2);
      padding: 0.36rem 1rem;
      font-family: var(--mono);
      font-size: 0.66rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .plugin-header .pf { color: var(--green); }

    .plugin-body {
      padding: 0.8rem 1rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      line-height: 2;
    }

    .cfg-key  { color: #7eb6ff; }
    .cfg-val  { color: #ce93d8; }
    .cfg-str  { color: #a5d6a7; }
    .cfg-com  { color: #2e4158; }

    /* ── projects ── */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(265px, 1fr));
      gap: 1rem;
    }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .project-card:hover {
      border-color: var(--green);
      box-shadow: 0 0 24px #00D26A0c;
    }

    .card-top-bar {
      background: var(--surface2);
      padding: 0.36rem 1rem;
      font-family: var(--mono);
      font-size: 0.64rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .ctb-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }

    /* version badge */
    .version-badge {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 0.58rem;
      padding: 0.1rem 0.45rem;
      border-radius: 3px;
      background: var(--green-glow);
      border: 1px solid var(--green-dim);
      color: var(--green);
    }

    .card-image {
      overflow: hidden;
      flex-shrink: 0;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      cursor: zoom-in;
      position: relative;
    }

    .card-image img {
      display: block;
      width: 100%;
      transition: transform 0.3s ease;
    }

    .card-image:hover img { transform: scale(1.03); }

    .card-image .zoom-hint {
      position: absolute;
      bottom: 6px; right: 8px;
      font-family: var(--mono);
      font-size: 0.58rem;
      color: var(--muted);
      background: #0D111788;
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .card-image:hover .zoom-hint { opacity: 1; }

    .card-image .img-placeholder {
      font-family: var(--mono);
      font-size: 0.63rem;
      color: var(--border);
      text-align: center;
      padding: 2.5rem;
    }

    .card-body {
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .project-type {
      font-family: var(--mono);
      font-size: 0.61rem;
      color: var(--green);
      margin-bottom: 0.28rem;
    }

    .project-name {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 0.55rem;
      line-height: 1.3;
      transition: color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
    }

    .project-name:hover { color: var(--green); }

    .project-name .ext-icon {
      font-size: 0.65rem;
      opacity: 0.45;
      transition: opacity 0.15s;
    }

    .project-name:hover .ext-icon { opacity: 1; }

    .project-desc {
      font-size: 0.79rem;
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 1rem;
      flex: 1;
    }

    .project-footer { display: flex; flex-direction: column; gap: 0.6rem; }

    .project-tags { display: flex; flex-wrap: wrap; gap: 0.32rem; }

    .tag {
      font-family: var(--mono);
      font-size: 0.59rem;
      padding: 0.17rem 0.48rem;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--muted);
    }

    /* ── contact ── */
    #contact .contact-inner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2rem;
      max-width: 460px;
    }

    .contact-console {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
      line-height: 2;
    }

    .c-prompt { color: var(--green); }

    #contact h2 {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    #contact p {
      font-size: 0.84rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
      line-height: 1.65;
    }

    .contact-link {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.6rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      transition: all 0.15s;
      position: relative;
    }

    .contact-link:hover {
      color: var(--green);
      border-color: var(--green);
      background: var(--green-glow);
    }

    /* copy flash */
    .copy-flash {
      position: absolute;
      right: 0.75rem;
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--green);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }

    .copy-flash.show { opacity: 1; }

    /* ── lightbox ── */
    #lightbox {
      position: fixed;
      inset: 0;
      background: #000000cc;
      backdrop-filter: blur(6px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    #lightbox.open { opacity: 1; pointer-events: all; }

    #lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 6px;
      border: 1px solid var(--border);
      object-fit: contain;
    }

    #lightbox-close {
      position: absolute;
      top: 1.25rem; right: 1.5rem;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      cursor: pointer;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.3rem 0.7rem;
      transition: color 0.15s, border-color 0.15s;
    }

    #lightbox-close:hover { color: var(--green); border-color: var(--green); }

    /* ── easter egg terminal ── */
    #easter-egg {
      position: fixed;
      bottom: 1.5rem; right: 1.5rem;
      width: 340px;
      background: var(--surface);
      border: 1px solid var(--green-dim);
      border-radius: 6px;
      overflow: hidden;
      z-index: 1500;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      box-shadow: 0 0 30px #00D26A18;
    }

    #easter-egg.open { opacity: 1; transform: translateY(0); pointer-events: all; }

    .ee-header {
      background: var(--surface2);
      padding: 0.38rem 0.85rem;
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .ee-header span { color: var(--green); }

    .ee-close {
      cursor: pointer;
      font-size: 0.7rem;
      transition: color 0.15s;
    }

    .ee-close:hover { color: var(--text); }

    .ee-body {
      padding: 0.85rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      line-height: 1.9;
    }

    .ee-body .eg { color: var(--green); }
    .ee-body .ew { color: #f0a05a; }

    .ee-input-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }

    .ee-input-row span { color: var(--green); }

    #ee-input {
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--text);
      flex: 1;
      caret-color: var(--green);
    }

    /* ── toast ── */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--surface);
      border: 1px solid var(--green-dim);
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--green);
      padding: 0.45rem 1rem;
      z-index: 3000;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }

    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 9px; }

    /* responsive */
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar {
        position: static; height: auto;
        border-right: none; border-bottom: 1px solid var(--border);
        flex-direction: row; flex-wrap: wrap; align-items: center;
        padding: 1rem 1.25rem; gap: 0.7rem;
      }
      .sidebar-avatar, .sidebar-footer, .ticker-wrap { display: none; }
      nav { flex-direction: row; flex-wrap: wrap; gap: 0.15rem; }
      section { padding: 3rem 1.5rem; }
      #music-btn { top: 10px; right: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .status-dot { animation: none; }
      .brand-cursor { animation: none; }
      .ticker-inner { animation: none; }
    }
  </style>
</head>
<body>

<script src="config.js"></script>

<!-- scroll progress -->
<div id="scroll-bar"></div>

<!-- music player -->
<div id="music-btn" title="Play music">
  <svg id="music-icon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
    <polygon points="5,3 19,12 5,21"/>
  </svg>
  <span id="music-label">play</span>
</div>
<audio id="music-audio" loop></audio>

<!-- lightbox -->
<div id="lightbox">
  <div id="lightbox-close">esc / close</div>
  <img id="lightbox-img" src="" alt="" />
</div>

<!-- easter egg terminal -->
<div id="easter-egg">
  <div class="ee-header">
    <span>server@lostgalax_y:~$</span>
    <span class="ee-close" id="ee-close">[ x ]</span>
  </div>
  <div class="ee-body" id="ee-output">
    <span class="eg">Type a command. Try: help, status, whoami, clear</span>
  </div>
  <div class="ee-input-row">
    <span>&gt;</span>
    <input id="ee-input" type="text" autocomplete="off" spellcheck="false" placeholder="command..." />
  </div>
</div>

<!-- toast -->
<div id="toast"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main id="main"></main>
</div>

<script>
/* ============================================================
   Render engine + feature scripts. Do not edit.
   ============================================================ */
const C = CONFIG;

/* accent color */
document.documentElement.style.setProperty('--green', C.accentColor || '#00D26A');
document.title = C.pageTitle || C.name;

/* helpers */
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function toast(msg, dur = 1600) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

/* ── scroll progress ── */
window.addEventListener('scroll', () => {
  const scrolled = window.scrollY;
  const total    = document.body.scrollHeight - window.innerHeight;
  document.getElementById('scroll-bar').style.width = (scrolled / total * 100) + '%';
}, { passive: true });

/* ── music player ── */
const audio      = document.getElementById('music-audio');
const musicBtn   = document.getElementById('music-btn');
const musicIcon  = document.getElementById('music-icon');
const musicLabel = document.getElementById('music-label');

if (C.music && C.music.enabled) {
  audio.src = C.music.src;
  musicBtn.title = C.music.label || 'creator.mp3';

  let playing = false;

  musicBtn.addEventListener('click', () => {
    if (playing) {
      audio.pause();
      playing = false;
      musicBtn.classList.remove('playing');
      musicLabel.textContent = 'play';
      musicIcon.innerHTML = '<polygon points="5,3 19,12 5,21"/>';
    } else {
      audio.play().then(() => {
        playing = true;
        musicBtn.classList.add('playing');
        musicLabel.textContent = 'pause';
        musicIcon.innerHTML = '<rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/>';
      }).catch(() => toast('Could not play audio.'));
    }
  });
} else {
  musicBtn.style.display = 'none';
}

/* ── lightbox ── */
const lightbox    = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

function openLightbox(src, alt) {
  lightboxImg.src = src;
  lightboxImg.alt = alt || '';
  lightbox.classList.add('open');
}

function closeLightbox() { lightbox.classList.remove('open'); }

document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

/* ── easter egg terminal ── */
const eePanel  = document.getElementById('easter-egg');
const eeInput  = document.getElementById('ee-input');
const eeOutput = document.getElementById('ee-output');
const eeClose  = document.getElementById('ee-close');
let eeBuf = [];

const eeCommands = {
  help:    () => `<span class="eg">Available commands:</span> help, whoami, status, skills, uptime, sudo, version, clear`,
  whoami:  () => `<span class="eg">${C.name}</span> — MC Dev & Server Admin`,
  status:  () => `Server status: <span class="eg">ONLINE</span> &bull; Players: <span class="ew">1/1</span> (that's you)`,
  skills:  () => `Java, Fabric API, Spigot, Paper, LuckPerms, WorldGuard, Multiverse...`,
  uptime:  () => `Uptime: <span class="eg">5 years, 0 crashes</span> (roughly)`,
  version: () => `Portfolio v2.0 &bull; Minecraft 1.21.1 &bull; Java 17`,
  sudo:    () => `<span class="ew">Permission denied.</span> Nice try though.`,
  clear:   () => { eeBuf = []; eeOutput.innerHTML = ''; return null; },
  exit:    () => { setTimeout(closeEE, 200); return '<span class="eg">Closing terminal...</span>'; }
};

function openEE() { eePanel.classList.add('open'); eeInput.focus(); }
function closeEE() { eePanel.classList.remove('open'); eeBuf = []; eeOutput.innerHTML = ''; }

eeClose.addEventListener('click', closeEE);

eeInput.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const cmd = eeInput.value.trim().toLowerCase();
  eeInput.value = '';
  if (!cmd) return;

  const fn = eeCommands[cmd];
  const result = fn ? fn() : `<span class="ew">Command not found:</span> ${cmd}. Try 'help'.`;

  if (result !== null) {
    eeBuf.push(`<span style="color:var(--green)">&gt;</span> ${cmd}`);
    if (result) eeBuf.push(result);
    if (eeBuf.length > 20) eeBuf = eeBuf.slice(-20);
    eeOutput.innerHTML = eeBuf.join('<br>');
  }
});

/* key listener: type "help" anywhere on the page to open */
let keyBuf = '';
document.addEventListener('keydown', e => {
  if (eePanel.classList.contains('open')) return;
  if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  keyBuf += e.key.toLowerCase();
  if (keyBuf.length > 6) keyBuf = keyBuf.slice(-6);
  if (keyBuf.includes('help') || keyBuf.includes('sudo')) openEE();
});

sidebar.appendChild(footer);

/* typing animation */
(function typeHero() {
  const lines = document.querySelectorAll('.typing-line');
  let i = 0;

  function typeLine(lineEl, text, cb) {
    lineEl.classList.add('visible');
    lineEl.textContent = '';
    let j = 0;
    const iv = setInterval(() => {
      lineEl.textContent += text[j++];
      if (j >= text.length) { clearInterval(iv); cb && setTimeout(cb, 180); }
    }, 38);
  }

  function next() {
    if (i >= lines.length) {
      document.getElementById('hero-sub').classList.add('visible');
      setTimeout(() => document.getElementById('hero-cta').classList.add('visible'), 300);
      return;
    }
    typeLine(lines[i], C.heroLines[i], next);
    i++;
  }

  setTimeout(next, 600);
})();

/* PROJECTS */

(C.projects || []).forEach(proj => {
  const card = el('div', 'project-card');

  /* top bar with version badge */
  const topBar = el('div', 'card-top-bar');
  topBar.innerHTML = `
    <span class="ctb-dot"></span>
    ${proj.type.toLowerCase()} &bull; ${proj.loader}
    <span class="version-badge">${proj.version}</span>
  `;
  card.appendChild(topBar);

  /* image with lightbox */
  const imgWrap = el('div', 'card-image');
  if (proj.image && proj.image.src) {
    const img = document.createElement('img');
    img.src = proj.image.src;
    img.alt = proj.name;
    img.style.height     = proj.image.height || '180px';
    img.style.objectFit  = proj.image.fit    || 'cover';
    imgWrap.style.height = proj.image.height || '180px';

    const hint = el('div', 'zoom-hint', 'click to expand');
    imgWrap.appendChild(img);
    imgWrap.appendChild(hint);

    imgWrap.addEventListener('click', () => openLightbox(proj.image.src, proj.name));
  } else {
    imgWrap.style.height = '90px';
    imgWrap.innerHTML = `<div class="img-placeholder">add image path in config.js</div>`;
  }
  card.appendChild(imgWrap);

  /* body */
  const body = el('div', 'card-body');
  const tagsHTML = (proj.tags || []).map(t => `<span class="tag">${t}</span>`).join('');

  /* project name — clickable if link is set */
  const nameEl = proj.link
    ? `<a class="project-name" href="${proj.link}" target="_blank">${proj.name} <span class="ext-icon">↗</span></a>`
    : `<span class="project-name" style="cursor:default">${proj.name}</span>`;

  body.innerHTML = `
    <div class="project-type">${proj.type} / ${proj.loader}</div>
    ${nameEl}
    <div class="project-desc">${proj.desc}</div>
    <div class="project-footer">
      <div class="project-tags">${tagsHTML}</div>
    </div>
  `;
  card.appendChild(body);
  grid.appendChild(card);
});

projects.appendChild(grid);

/* copy discord on click */
const discordLink = document.getElementById('discord-link');
const copyFlash   = document.getElementById('copy-flash');
if (discordLink && dc.discord) {
  discordLink.addEventListener('click', e => {
    e.preventDefault();
    navigator.clipboard.writeText(dc.discord).then(() => {
      copyFlash.classList.add('show');
      toast('Discord tag copied!');
      setTimeout(() => copyFlash.classList.remove('show'), 1500);
    });
  });
}

/* ── active nav on scroll ── */
const allSections = document.querySelectorAll('section[id]');
const navLinks    = document.querySelectorAll('nav a');

const io = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      navLinks.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + entry.target.id));
    }
  });
}, { threshold: 0.3 });

allSections.forEach(s => io.observe(s));
</script>
